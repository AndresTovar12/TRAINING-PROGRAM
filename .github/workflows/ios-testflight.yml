# Compila la app de iPhone en la nube y la sube a TestFlight.
# Se dispara de dos formas: a mano (GitHub → Actions → «iOS a TestFlight» → Run workflow) o al subir cambios a la rama `ios-build`.
# Al terminar (bien o mal) publica el resultado y el final del registro en la rama `ios-logs`, para poder leerlo sin entrar a GitHub.
# Necesita UN secreto del repositorio (Settings → Secrets and variables → Actions):
#   ASC_KEY_P8      TODO el texto del archivo AuthKey_ANLLBDRPU8.p8 (con las líneas BEGIN/END)
# El Key ID y el Issuer ID de la llave «GITHUB ACCESS» NO son secretos (van abajo, en `env`); lo secreto es solo el archivo .p8.
# Los dos VITE_… también son públicos (viajan dentro de cualquier app web).
name: iOS a TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ios-build]

permissions:
  contents: write

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ANLLBDRPU8
      ASC_ISSUER_ID: f7faf1b1-4d15-4b90-aa92-678ce284f1b0
      VITE_SUPABASE_URL: https://ozwqqzrkgunrgxxwxmop.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ApSlA6PxKg9WVuGYSVRk4Q_11D379x_
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Xcode más nuevo
        run: |
          NUEVO=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NUEVO/Contents/Developer"
          xcodebuild -version

      - name: Instalar y construir la web
        run: |
          set -o pipefail
          { npm ci && npm run build; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Pasar la web al proyecto de iPhone
        run: |
          set -o pipefail
          npx cap sync ios 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Guardar la llave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${{ env.ASC_KEY_ID }}.p8"

      - name: Agregar la extensión de pantalla bloqueada al proyecto
        run: |
          set -o pipefail
          ruby -e 'require "xcodeproj"' 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/ci/agrega_extensiones.rb 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Compilar (archive, sin firmar)
        # Sin firmar a propósito: firmar la versión de pruebas exige tener un iPhone registrado en la cuenta, y para TestFlight no hace falta.
        # La firma de distribución la pone el paso siguiente (exportArchive).
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Poner los permisos en la app antes de firmarla
        # Compilar sin firmar pierde los permisos (Salud, Apple, links): Xcode los toma de la firma que ya trae la app. Se le pone una firma provisional con
        # los permisos y el paso siguiente la cambia por la de distribución, conservándolos.
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          codesign -d --entitlements :- "$APP" 2>&1 | head -30 | tee -a "$RUNNER_TEMP/build.log"

      - name: Firmar (crea el .ipa)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${{ env.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ env.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ env.ASC_ISSUER_ID }}" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Qué permisos quedaron en la app firmada (diagnóstico)
        run: |
          set -o pipefail
          {
            cd "$RUNNER_TEMP/export" && ls -la
            rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o App.ipa -d "$RUNNER_TEMP/ipa"
            echo "=== PERMISOS FIRMADOS ==="
            codesign -d --entitlements :- "$RUNNER_TEMP/ipa/Payload/App.app" 2>&1 | head -60
            echo "=== PERFIL DE APROBACIÓN: permisos ==="
            security cms -D -i "$RUNNER_TEMP/ipa/Payload/App.app/embedded.mobileprovision" | plutil -extract Entitlements xml1 -o - - | head -60
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Subir a TestFlight
        run: |
          set -o pipefail
          mkdir -p ~/.private_keys
          cp "$RUNNER_TEMP/asc/AuthKey_${{ env.ASC_KEY_ID }}.p8" ~/.private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "${{ env.ASC_KEY_ID }}" --apiIssuer "${{ env.ASC_ISSUER_ID }}" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Publicar el resultado (rama ios-logs)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q && git checkout -q -b ios-logs
          echo "corrida=${{ github.run_number }} commit=${{ github.sha }} resultado=${{ job.status }}" > estado.txt
          touch "$RUNNER_TEMP/build.log"
          tail -n 400 "$RUNNER_TEMP/build.log" > fin.log
          grep -nE "error:|\*\* .* FAILED|Provisioning|entitlement|PERMISOS|applesignin|healthkit|associated-domains" "$RUNNER_TEMP/build.log" | head -80 > errores.txt || true
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "iOS corrida ${{ github.run_number }}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ios-logs
