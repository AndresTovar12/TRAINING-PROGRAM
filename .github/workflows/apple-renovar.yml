# Renueva sola la «clave secreta» de Sign in with Apple para la WEB (Apple la hace caducar a los 6 meses; aquí se cambia cada 3).
# Fabrica la clave nueva con `scripts/apple-secreto.py` y la pone en Supabase por su API. Si algo falla, la corrida sale en rojo y GitHub te manda un correo.
# La puerta del iPhone NO usa esta clave: aunque esto fallara, el iPhone y las demás entradas (correo, Google) siguen funcionando.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   APPLE_P8_TEXTO         TODO el texto del archivo AuthKey_QJX3P8G74S.p8 (con las líneas BEGIN/END)
#   SUPABASE_ACCESS_TOKEN  token personal de Supabase (supabase.com/dashboard/account/tokens)
# Se corre solo el día 1 de cada tercer mes, al subir cambios a la rama `apple-renovar-prueba`, o a mano: Actions → «Renovar clave de Apple (web)» → Run workflow.
name: Renovar clave de Apple (web)

on:
  push:
    branches: [apple-renovar-prueba]
  schedule:
    - cron: '0 15 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPLE_KEY_ID: QJX3P8G74S
      APPLE_TEAM_ID: UQ99Q69ULQ
      APPLE_SERVICES_ID: com.traininglabapp.web
      SUPABASE_REF: ozwqqzrkgunrgxxwxmop
    steps:
      - uses: actions/checkout@v4

      - name: Preparar
        run: pip install --quiet cryptography

      - name: Fabricar la clave nueva y ponerla en Supabase
        env:
          APPLE_P8_TEXTO: ${{ secrets.APPLE_P8_TEXTO }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/diag.txt"; : > "$D"
          falla() { echo "FALLO: $1" | tee -a "$D" >&2; exit 1; }
          echo "largo APPLE_P8_TEXTO=${#APPLE_P8_TEXTO} · largo SUPABASE_ACCESS_TOKEN=${#SUPABASE_ACCESS_TOKEN}" >> "$D"
          [ -n "$APPLE_P8_TEXTO" ] || falla "falta el secreto APPLE_P8_TEXTO"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || falla "falta el secreto SUPABASE_ACCESS_TOKEN"
          printf '%s\n' "$APPLE_P8_TEXTO" > "$RUNNER_TEMP/clave.p8"
          SECRETO=$(python3 scripts/apple-secreto.py "$RUNNER_TEMP/clave.p8" "$APPLE_KEY_ID" "$APPLE_TEAM_ID" "$APPLE_SERVICES_ID" 2>"$RUNNER_TEMP/err.txt") || { tail -n 3 "$RUNNER_TEMP/err.txt" >> "$D"; falla "no se pudo fabricar la clave (¿el texto del .p8 está completo?)"; }
          echo "::add-mask::$SECRETO"
          rm -f "$RUNNER_TEMP/clave.p8"
          # Client IDs: la WEB va primero (Supabase usa el primero para el OAuth de la página); la app del iPhone acepta cualquiera de los dos.
          CUERPO=$(python3 -c 'import json,sys; print(json.dumps({"external_apple_secret": sys.argv[1], "external_apple_client_id": "com.traininglabapp.web,com.traininglabapp.app"}))' "$SECRETO")
          CODIGO=$(curl -sS -o "$RUNNER_TEMP/respuesta.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$CUERPO") || falla "no se pudo hablar con Supabase"
          echo "Supabase contestó: $CODIGO" | tee -a "$D"
          if [ "$CODIGO" -lt 200 ] || [ "$CODIGO" -ge 300 ]; then head -c 300 "$RUNNER_TEMP/respuesta.json" >> "$D"; falla "Supabase rechazó el cambio"; fi
          # Comprobar que Apple sigue encendido tras el cambio.
          curl -sS "https://api.supabase.com/v1/projects/${SUPABASE_REF}/config/auth" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c.get("external_apple_enabled") is True, "Apple quedó apagado"; print("Apple sigue encendido; Client IDs:", c.get("external_apple_client_id"))' 2>&1 | tee -a "$D"
          echo "TODO BIEN" >> "$D"

      - name: Publicar el resultado (rama apple-logs; sin secretos)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q && git checkout -q -b apple-logs
          cp "$RUNNER_TEMP/diag.txt" . 2>/dev/null || echo "sin diagnóstico" > diag.txt
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "renovación de la clave de Apple: ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apple-logs
